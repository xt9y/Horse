name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  renderer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject rasterizer fallback
        run: |
          if grep -R -n -E 'class Rasterizer|renderCompatibility|\[Rasterizer\]: compatibility' Sources/Renderer/Render.hpp Sources/Renderer/Render.cpp 2>/dev/null; then
            echo "renderer fallback still exists"
            exit 1
          fi
      - name: Require Metal PathTracer backend
        run: |
          test -f Sources/Renderer/PathTracer/PathTracerMetalShaders.hpp
          test -f Sources/Renderer/PathTracer/PathTracerMetal.cpp
          grep -q 'Metal.create' Sources/Renderer/PathTracer/PathTracerMetal.cpp
          grep -q 'Metal.createComputePipeline' Sources/Renderer/PathTracer/PathTracerMetal.cpp
          grep -q 'Metal.dispatch' Sources/Renderer/PathTracer/PathTracerMetal.cpp
          grep -q 'Metal.beginRenderToDrawable' Sources/Renderer/PathTracer/PathTracerMetal.cpp
          grep -q 'Metal.present' Sources/Renderer/PathTracer/PathTracerMetal.cpp
          if grep -q 'lwcgl/gl11_compat.h' Sources/Renderer/PathTracer/PathTracer.hpp; then
            echo "public PathTracer header leaks OpenGL declarations"
            exit 1
          fi
      - name: Require full reset coverage
        run: |
          grep -q 'RESET_PHASE_GRID = 1' Sources/Renderer/PathTracer/PathTracerWorldFastShaders.hpp
          grep -q 'RESET_PHASE_GRID = 1u' Sources/Renderer/PathTracer/PathTracerMetalShaders.hpp
          grep -q 'uResetAccumulation != 0 ? RESET_PHASE_GRID : STATIONARY_PHASE_GRID' Sources/Renderer/PathTracer/PathTracerWorldFastShaders.hpp
          grep -q 'reset ? RESET_PHASE_GRID : STATIONARY_PHASE_GRID' Sources/Renderer/PathTracer/PathTracerMetalShaders.hpp
          if grep -R -n 'MOVING_PHASE_GRID' Sources/Renderer/PathTracer/PathTracerWorldFastShaders.hpp Sources/Renderer/PathTracer/PathTracerMetalShaders.hpp; then
            echo "reset path still uses sparse moving-phase sampling"
            exit 1
          fi
      - name: Require Metal frame completion before shared-state reuse
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('Sources/Renderer/PathTracer/PathTracerMetal.cpp').read_text()
          begin = source.index('bool dispatchAndPresent(')
          end = source.index('\n    }\n};', begin)
          body = source[begin:end]
          commit = body.index('Metal.commit(command)')
          wait = body.index('Metal.wait(command)')
          destroy = body.index('Metal.destroyCommand(command)')
          assert commit < wait < destroy, 'Metal command must complete before shared uniform/accumulation state can be reused'
          PY

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev
          git clone --depth 1 --branch v2.9.3 https://github.com/xt9y/lwcgl.git "$RUNNER_TEMP/lwcgl"
          make -C "$RUNNER_TEMP/lwcgl" clean all
          sudo make -C "$RUNNER_TEMP/lwcgl" install
          git clone --depth 1 https://github.com/xt9y/C-BuildSystem.git "$RUNNER_TEMP/c-buildsystem"
          make -C "$RUNNER_TEMP/c-buildsystem" clean all
          sudo make -C "$RUNNER_TEMP/c-buildsystem" install
      - name: Build OpenGL PathTracer shared library
        run: |
          c clean || true
          c build
      - name: Run canonical FBX contracts
        run: |
          set -euo pipefail
          EARTH="tests/fixtures/earth_regression.fbx"
          test -s "$EARTH"
          LIB="$(find build -type f -name 'libecs-model-rasterizer.so' | head -1)"
          test -n "$LIB"
          LIBDIR="$(cd "$(dirname "$LIB")" && pwd)"
          for source in \
            tests/fbx_canonical_contract.cpp \
            tests/fbx_rotation_order_contract.cpp \
            tests/fbx_geometry_semantics_contract.cpp \
            tests/fbx_material_semantics_contract.cpp \
            tests/fbx_skin_animation_contract.cpp
          do
            name="$(basename "$source" .cpp)"
            c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources -Itests \
              "$source" -L"$LIBDIR" -lecs-model-rasterizer \
              -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib -o "/tmp/$name"
            echo "[run] $name"
            LD_LIBRARY_PATH="$LIBDIR:/usr/local/lib:${LD_LIBRARY_PATH:-}" "/tmp/$name"
          done
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources \
            tests/earth_fbx_contract.cpp -L"$LIBDIR" -lecs-model-rasterizer \
            -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib -o /tmp/earth-fbx-contract
          LD_LIBRARY_PATH="$LIBDIR:/usr/local/lib:${LD_LIBRARY_PATH:-}" /tmp/earth-fbx-contract "$EARTH"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install pkg-config glfw
          git clone --depth 1 --branch v2.9.3 https://github.com/xt9y/lwcgl.git "$RUNNER_TEMP/lwcgl"
          make -C "$RUNNER_TEMP/lwcgl" clean all
          sudo make -C "$RUNNER_TEMP/lwcgl" install
          git clone --depth 1 https://github.com/xt9y/lwmgl.git "$RUNNER_TEMP/lwmgl"
          make -C "$RUNNER_TEMP/lwmgl" clean all
          sudo make -C "$RUNNER_TEMP/lwmgl" install
          git clone --depth 1 https://github.com/xt9y/C-BuildSystem.git "$RUNNER_TEMP/c-buildsystem"
          make -C "$RUNNER_TEMP/c-buildsystem" clean all
          sudo make -C "$RUNNER_TEMP/c-buildsystem" install
      - name: Build Horse shared library
        run: |
          c clean || true
          c build
      - name: Compile and run Metal shader contract
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I. -I/usr/local/include/lwmgl-1.0.0 -I/opt/homebrew/include \
            tests/path_tracer_metal_shader_contract.cpp \
            -L/usr/local/lib -llwmgl -L/opt/homebrew/lib -lglfw \
            -framework Metal -framework QuartzCore -framework AppKit -framework Foundation \
            -Wl,-rpath,/usr/local/lib \
            -o /tmp/path-tracer-metal-shader-contract
          /tmp/path-tracer-metal-shader-contract
      - name: Run canonical FBX contracts
        run: |
          set -euo pipefail
          EARTH="tests/fixtures/earth_regression.fbx"
          test -s "$EARTH"
          LIB="$(find build -type f -name 'libecs-model-rasterizer.dylib' | head -1)"
          test -n "$LIB"
          LIBDIR="$(cd "$(dirname "$LIB")" && pwd)"
          for source in \
            tests/fbx_canonical_contract.cpp \
            tests/fbx_rotation_order_contract.cpp \
            tests/fbx_geometry_semantics_contract.cpp \
            tests/fbx_material_semantics_contract.cpp \
            tests/fbx_skin_animation_contract.cpp
          do
            name="$(basename "$source" .cpp)"
            c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources -Itests \
              "$source" -L"$LIBDIR" -lecs-model-rasterizer \
              -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib -o "/tmp/$name"
            echo "[run] $name"
            "/tmp/$name"
          done
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources \
            tests/earth_fbx_contract.cpp -L"$LIBDIR" -lecs-model-rasterizer \
            -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib -o /tmp/earth-fbx-contract
          /tmp/earth-fbx-contract "$EARTH"
