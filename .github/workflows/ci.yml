name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  renderer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit independent renderer backends
        run: |
          python3 - <<'PY'
          from pathlib import Path

          interface = Path('Sources/Renderer/Renderer.hpp').read_text()
          umbrella = Path('Sources/Renderer/Render.hpp').read_text()
          raster_h = Path('Sources/Renderer/Rasterizer/Rasterizer.hpp').read_text()
          raster_cpp = Path('Sources/Renderer/Rasterizer/Rasterizer.cpp').read_text()
          gl_pt = Path('Sources/Renderer/PathTracer/PathTracer.cpp').read_text()
          metal_pt = Path('Sources/Renderer/PathTracer/PathTracerMetal.cpp').read_text()
          build = Path('build.c').read_text()

          assert 'class IRenderer' in interface
          assert '#include "Renderer/PathTracer/PathTracer.hpp"' in umbrella
          assert '#include "Renderer/Rasterizer/Rasterizer.hpp"' in umbrella
          assert 'class Rasterizer final : public IRenderer' in raster_h
          assert 'class PathTracer final : public IRenderer' in Path('Sources/Renderer/PathTracer/PathTracer.hpp').read_text()
          assert 'Sources/Renderer/Rasterizer/Rasterizer.cpp' in build

          raster_source = raster_h + '\n' + raster_cpp
          for forbidden in ('PathTracer', 'supportsPathTracer', 'use_path_tracer', 'renderCompatibility'):
              assert forbidden not in raster_source, forbidden
          assert 'Rasterizer' not in gl_pt
          assert 'Rasterizer' not in metal_pt

          for source in (gl_pt, metal_pt):
              assert '#include "Renderer/Math.hpp"' in source
              assert '#include "Renderer/Scene.hpp"' in source
              assert 'Scene::collectRenderItems' in source
              assert 'Scene::cameraState' in source
              assert 'Scene::lightState' in source
              assert 'std::vector<Scene::RenderItem> render_items' in source
              assert 'CameraState cameraState(const Ecs::World& world)' not in source
              assert 'LightState lightState(const Ecs::World& world)' not in source
          PY
      - name: Require Metal PathTracer backend
        run: |
          test -f Sources/Renderer/PathTracer/PathTracerMetalShaders.hpp
          test -f Sources/Renderer/PathTracer/PathTracerMetal.cpp
          grep -q 'Metal.create' Sources/Renderer/PathTracer/PathTracerMetal.cpp
          grep -q 'Metal.createComputePipeline' Sources/Renderer/PathTracer/PathTracerMetal.cpp
          grep -q 'Metal.dispatch' Sources/Renderer/PathTracer/PathTracerMetal.cpp
          grep -q 'Metal.beginRenderToDrawable' Sources/Renderer/PathTracer/PathTracerMetal.cpp
          grep -q 'Metal.present' Sources/Renderer/PathTracer/PathTracerMetal.cpp
          if grep -q 'lwcgl/gl11_compat.h' Sources/Renderer/PathTracer/PathTracer.hpp; then
            echo "public PathTracer header leaks OpenGL declarations"
            exit 1
          fi
      - name: Require sparse black camera movement path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gl_shader = Path('Sources/Renderer/PathTracer/PathTracerWorldFastShaders.hpp').read_text()
          metal_shader = Path('Sources/Renderer/PathTracer/PathTracerMetalShaders.hpp').read_text()
          gl_cpu = Path('Sources/Renderer/PathTracer/PathTracer.cpp').read_text()
          metal_cpu = Path('Sources/Renderer/PathTracer/PathTracerMetal.cpp').read_text()

          assert 'MOVING_PHASE_GRID = 4' in gl_shader
          assert 'MOVING_PHASE_GRID = 4u' in metal_shader
          assert 'uCameraMoving' in gl_shader
          assert 'camera_moving' in metal_cpu
          assert 'camera_moving' in gl_cpu
          assert 'uCameraMoving != 0 ? MOVING_PHASE_GRID' in gl_shader
          assert 'camera_moving ? MOVING_PHASE_GRID' in metal_shader
          assert 'uCameraMoving != 0 && accumulated.a <= 0.0' in gl_shader
          assert 'uniforms.exposure.y > 0.5f && accumulated.a <= 0.0f' in metal_shader
          assert 'was_camera_moving' in gl_cpu
          assert 'was_camera_moving' in metal_cpu
          PY
      - name: Require Metal frame completion before shared-state reuse
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('Sources/Renderer/PathTracer/PathTracerMetal.cpp').read_text()
          begin = source.index('bool dispatchAndPresent(')
          end = source.index('\n    }\n};', begin)
          body = source[begin:end]
          commit = body.index('Metal.commit(command)')
          wait = body.index('Metal.wait(command)')
          destroy = body.index('Metal.destroyCommand(command)')
          assert commit < wait < destroy
          PY
      - name: Run geometric-normal regression
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            tests/path_tracer_geometric_normal_contract.cpp \
            -o /tmp/path-tracer-geometric-normal-contract
          /tmp/path-tracer-geometric-normal-contract

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev xvfb
          git clone --depth 1 --branch v2.9.3 https://github.com/xt9y/lwcgl.git "$RUNNER_TEMP/lwcgl"
          make -C "$RUNNER_TEMP/lwcgl" clean all
          sudo make -C "$RUNNER_TEMP/lwcgl" install
          git clone --depth 1 https://github.com/xt9y/C-BuildSystem.git "$RUNNER_TEMP/c-buildsystem"
          make -C "$RUNNER_TEMP/c-buildsystem" clean all
          sudo make -C "$RUNNER_TEMP/c-buildsystem" install
      - name: Build Horse with PathTracer and Rasterizer
        run: |
          c clean || true
          c build
      - name: Run renderer common and Rasterizer contracts
        run: |
          set -euo pipefail
          LIB="$(find build -type f -name 'libHorse.so' | head -1)"
          test -n "$LIB"
          LIBDIR="$(cd "$(dirname "$LIB")" && pwd)"

          for source in tests/renderer_common_contract.cpp tests/rasterizer_architecture_contract.cpp; do
            name="$(basename "$source" .cpp)"
            c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources \
              "$source" -L"$LIBDIR" -lHorse \
              -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib -o "/tmp/$name"
            LD_LIBRARY_PATH="$LIBDIR:/usr/local/lib:${LD_LIBRARY_PATH:-}" "/tmp/$name"
          done

          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources -I/usr/local/include/lwcgl-2.9.3 \
            tests/rasterizer_runtime_contract.cpp -L"$LIBDIR" -lHorse -L/usr/local/lib -llwcgl \
            -lglfw -lGL -lGLU -ldl -lpthread -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib \
            -o /tmp/rasterizer-runtime-contract
          LD_LIBRARY_PATH="$LIBDIR:/usr/local/lib:${LD_LIBRARY_PATH:-}" xvfb-run -a /tmp/rasterizer-runtime-contract
      - name: Run canonical FBX and model contracts
        run: |
          set -euo pipefail
          EARTH="tests/fixtures/earth_regression.fbx"
          test -s "$EARTH"
          LIB="$(find build -type f -name 'libHorse.so' | head -1)"
          test -n "$LIB"
          LIBDIR="$(cd "$(dirname "$LIB")" && pwd)"
          for source in \
            tests/fbx_canonical_contract.cpp \
            tests/fbx_rotation_order_contract.cpp \
            tests/fbx_geometry_semantics_contract.cpp \
            tests/fbx_material_semantics_contract.cpp \
            tests/fbx_skin_animation_contract.cpp \
            tests/model_registration_contract.cpp \
            tests/material_update_contract.cpp
          do
            name="$(basename "$source" .cpp)"
            c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources -Itests \
              "$source" -L"$LIBDIR" -lHorse \
              -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib -o "/tmp/$name"
            echo "[run] $name"
            LD_LIBRARY_PATH="$LIBDIR:/usr/local/lib:${LD_LIBRARY_PATH:-}" "/tmp/$name"
          done
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources \
            tests/earth_fbx_contract.cpp -L"$LIBDIR" -lHorse \
            -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib -o /tmp/earth-fbx-contract
          LD_LIBRARY_PATH="$LIBDIR:/usr/local/lib:${LD_LIBRARY_PATH:-}" /tmp/earth-fbx-contract "$EARTH"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install pkg-config glfw
          git clone --depth 1 --branch v2.9.3 https://github.com/xt9y/lwcgl.git "$RUNNER_TEMP/lwcgl"
          make -C "$RUNNER_TEMP/lwcgl" clean all
          sudo make -C "$RUNNER_TEMP/lwcgl" install
          git clone --depth 1 https://github.com/xt9y/lwmgl.git "$RUNNER_TEMP/lwmgl"
          make -C "$RUNNER_TEMP/lwmgl" clean all
          sudo make -C "$RUNNER_TEMP/lwmgl" install
          git clone --depth 1 https://github.com/xt9y/C-BuildSystem.git "$RUNNER_TEMP/c-buildsystem"
          make -C "$RUNNER_TEMP/c-buildsystem" clean all
          sudo make -C "$RUNNER_TEMP/c-buildsystem" install
      - name: Build Horse with PathTracer and Rasterizer
        run: |
          c clean || true
          c build
      - name: Compile and run renderer common API contracts
        run: |
          set -euo pipefail
          LIB="$(find build -type f -name 'libHorse.dylib' | head -1)"
          test -n "$LIB"
          LIBDIR="$(cd "$(dirname "$LIB")" && pwd)"
          for source in tests/renderer_common_contract.cpp tests/rasterizer_architecture_contract.cpp; do
            name="$(basename "$source" .cpp)"
            c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources \
              "$source" -L"$LIBDIR" -lHorse \
              -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib -o "/tmp/$name"
            "/tmp/$name"
          done
      - name: Compile and run Metal shader contract
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I. -I/usr/local/include/lwmgl-1.0.0 -I/opt/homebrew/include \
            tests/path_tracer_metal_shader_contract.cpp \
            -L/usr/local/lib -llwmgl -L/opt/homebrew/lib -lglfw \
            -framework Metal -framework QuartzCore -framework AppKit -framework Foundation \
            -Wl,-rpath,/usr/local/lib \
            -o /tmp/path-tracer-metal-shader-contract
          /tmp/path-tracer-metal-shader-contract
      - name: Run canonical FBX and model contracts
        run: |
          set -euo pipefail
          EARTH="tests/fixtures/earth_regression.fbx"
          test -s "$EARTH"
          LIB="$(find build -type f -name 'libHorse.dylib' | head -1)"
          test -n "$LIB"
          LIBDIR="$(cd "$(dirname "$LIB")" && pwd)"
          for source in \
            tests/fbx_canonical_contract.cpp \
            tests/fbx_rotation_order_contract.cpp \
            tests/fbx_geometry_semantics_contract.cpp \
            tests/fbx_material_semantics_contract.cpp \
            tests/fbx_skin_animation_contract.cpp \
            tests/model_registration_contract.cpp \
            tests/material_update_contract.cpp
          do
            name="$(basename "$source" .cpp)"
            c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources -Itests \
              "$source" -L"$LIBDIR" -lHorse \
              -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib -o "/tmp/$name"
            echo "[run] $name"
            "/tmp/$name"
          done
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources \
            tests/earth_fbx_contract.cpp -L"$LIBDIR" -lHorse \
            -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib -o /tmp/earth-fbx-contract
          /tmp/earth-fbx-contract "$EARTH"
