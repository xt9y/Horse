name: Material Update Contract

on:
  push:
    branches: [main]
    paths:
      - 'tests/material_update_contract.cpp'
      - 'Sources/Models/Models.hpp'
      - 'Sources/Models/Models.cpp'
      - '.github/workflows/material-update-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev
          git clone --depth 1 --branch v2.9.3 https://github.com/xt9y/lwcgl.git "$RUNNER_TEMP/lwcgl"
          make -C "$RUNNER_TEMP/lwcgl" clean all
          sudo make -C "$RUNNER_TEMP/lwcgl" install
          git clone --depth 1 https://github.com/xt9y/C-BuildSystem.git "$RUNNER_TEMP/cbuild"
          make -C "$RUNNER_TEMP/cbuild" clean all
          sudo make -C "$RUNNER_TEMP/cbuild" install
      - name: Build Horse
        run: c build
      - name: Compile and run material update contract
        run: |
          LIB="$(find build -type f -name 'libecs-model-rasterizer.so' | head -1)"
          LIBDIR="$(dirname "$LIB")"
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources \
            tests/material_update_contract.cpp -L"$LIBDIR" -lecs-model-rasterizer \
            -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib -o /tmp/material-update-contract
          LD_LIBRARY_PATH="$LIBDIR:/usr/local/lib:${LD_LIBRARY_PATH:-}" /tmp/material-update-contract
