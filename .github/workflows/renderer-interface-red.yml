name: Renderer Interface RED

on:
  push:
    branches: [main]
    paths:
      - 'tests/renderer_common_contract.cpp'
      - '.github/workflows/renderer-interface-red.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile renderer interface contract
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources \
            -c tests/renderer_common_contract.cpp -o /tmp/renderer-common-contract.o
