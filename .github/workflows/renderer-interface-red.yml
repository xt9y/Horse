name: Renderer Common Contract

on:
  push:
    branches: [main]
    paths:
      - 'tests/renderer_common_contract.cpp'
      - 'Sources/Renderer/Renderer.hpp'
      - 'Sources/Renderer/Math.hpp'
      - 'Sources/Renderer/Math.cpp'
      - 'Sources/Renderer/Scene.hpp'
      - 'Sources/Renderer/Scene.cpp'
      - 'Sources/Renderer/PathTracer/PathTracer.hpp'
      - '.github/workflows/renderer-interface-red.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev
          git clone --depth 1 --branch v2.9.3 https://github.com/xt9y/lwcgl.git "$RUNNER_TEMP/lwcgl"
          make -C "$RUNNER_TEMP/lwcgl" clean all
          sudo make -C "$RUNNER_TEMP/lwcgl" install
          git clone --depth 1 https://github.com/xt9y/C-BuildSystem.git "$RUNNER_TEMP/c-buildsystem"
          make -C "$RUNNER_TEMP/c-buildsystem" clean all
          sudo make -C "$RUNNER_TEMP/c-buildsystem" install
      - name: Build Horse
        run: c build
      - name: Compile and run renderer common contract
        run: |
          set -euo pipefail
          LIB="$(find build -type f -name 'libHorse.so' | head -1)"
          test -n "$LIB"
          LIBDIR="$(cd "$(dirname "$LIB")" && pwd)"
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources \
            tests/renderer_common_contract.cpp -L"$LIBDIR" -lHorse \
            -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib \
            -o /tmp/renderer-common-contract
          LD_LIBRARY_PATH="$LIBDIR:/usr/local/lib:${LD_LIBRARY_PATH:-}" \
            /tmp/renderer-common-contract
