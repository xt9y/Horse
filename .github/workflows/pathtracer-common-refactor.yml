name: PathTracer Common Refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pathtracer-common-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refactor both PathTracer backends onto Renderer Math and Scene
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('Sources/Renderer/PathTracer/PathTracer.cpp'),
              Path('Sources/Renderer/PathTracer/PathTracerMetal.cpp'),
          ]

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          def replace_region(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker missing')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{label}: end marker missing')
              return text[:start] + replacement + text[end:]

          common_math = '''using Mat4 = Math::Mat4;
          using Vec3f = Vec3;
          using Math::cross;
          using Math::inverseModelMatrix;
          using Math::modelMatrix;
          using Math::normalize;
          using Math::transformNormal;
          using Math::transformPoint;

          constexpr float kPi = 3.14159265358979323846f;
          constexpr std::uint32_t kLeafBit = 0x80000000u;
          constexpr std::uint32_t kLeafSize = 8u;
          constexpr std::size_t kMaximumTriangles = 1000000u;
          constexpr std::size_t kMaximumTextureSlots = 16u;

          Vec3f subtract(const Vec3f& a, const Vec3f& b)
          {
              return {a.x - b.x, a.y - b.y, a.z - b.z};
          }

          Vec3f minVec(const Vec3f& a, const Vec3f& b)
          {
              return {std::min(a.x, b.x), std::min(a.y, b.y), std::min(a.z, b.z)};
          }

          Vec3f maxVec(const Vec3f& a, const Vec3f& b)
          {
              return {std::max(a.x, b.x), std::max(a.y, b.y), std::max(a.z, b.z)};
          }

          float component(const Vec3f& value, int axis)
          {
              return axis == 0 ? value.x : (axis == 1 ? value.y : value.z);
          }

          '''.replace('\n          ', '\n').lstrip()

          scene_signature = '''    std::uint64_t sceneSignature(
              const Ecs::World& world,
              const std::vector<Scene::RenderItem>& items
          ) const
          {
              std::uint64_t hash = 1469598103934665603ull;
              for (const Scene::RenderItem& item : items) {
                  hashValue(hash, item.entity);
                  hashValue(hash, item.mesh_component->mesh);
                  hashValue(hash, item.mesh_component->material);
                  hashTransform(hash, *item.transform);

                  const Animation::SkinBindingComponent *binding =
                      world.get<Animation::SkinBindingComponent>(item.entity);
                  if (binding && binding->animator != Ecs::INVALID_ENTITY) {
                      const Animation::AnimatorComponent *animator =
                          world.get<Animation::AnimatorComponent>(binding->animator);
                      if (animator) {
                          hashValue(hash, binding->animator);
                          hashValue(hash, animator->pose.revision);
                      }
                  }
              }
              return hash;
          }

          '''.replace('\n          ', '\n').lstrip()

          camera_convert = '''    CameraState cameraState(const Scene::CameraState& source) const
          {
              CameraState state;
              if (!source.valid) return state;

              const Vec3 forward = Camera::flightDirection(
                  source.transform.rotation.y,
                  source.transform.rotation.x
              );
              const Vec3 right = Camera::strafeDirection(source.transform.rotation.y);

              state.valid = true;
              state.position = source.transform.position;
              state.forward = normalize(forward);
              state.right = normalize(right);
              state.up = normalize(cross(state.right, state.forward));
              state.fov_degrees = std::clamp(source.fov_degrees, 1.0f, 179.0f);
              return state;
          }

          '''.replace('\n          ', '\n').lstrip()

          light_convert = '''    LightState lightState(const Scene::LightState& source) const
          {
              LightState result;
              if (!source.valid || source.light.type != LightType::Point) return result;

              result.valid = true;
              result.position = source.transform.position;
              result.color = source.light.color;
              result.intensity = std::max(source.light.intensity, 0.0f);
              return result;
          }

          '''.replace('\n          ', '\n').lstrip()

          item_loop = '''        for (const Scene::RenderItem& item : items) {
              if (gpu_triangles.size() >= kMaximumTriangles) break;

              const Ecs::Entity entity = item.entity;
              const MeshComponent *mesh_component = item.mesh_component;
              const Transform *transform = item.transform;
              const Models::MeshData *mesh = item.mesh;
              if (!mesh || mesh->indices.size() < 3u || mesh->vertices.empty()) continue;

              const Models::MaterialData *material = item.material;
          '''.replace('\n              ', '\n            ').rstrip() + '\n'

          for path in paths:
              text = path.read_text()

              shader_include = (
                  '#include "Renderer/Components.hpp"\n'
                  '#include "Renderer/PathTracer/'
              )
              if shader_include not in text:
                  raise SystemExit(f'{path}: renderer include anchor missing')
              text = text.replace(
                  '#include "Renderer/Components.hpp"\n',
                  '#include "Renderer/Components.hpp"\n#include "Renderer/Math.hpp"\n#include "Renderer/Scene.hpp"\n',
                  1,
              )

              text = replace_region(
                  text,
                  'using Mat4 = std::array<float, 16>;\n',
                  'void hashValue(std::uint64_t& hash, std::uint32_t value)\n',
                  common_math,
                  f'{path}: common math',
              )

              text = replace_once(
                  text,
                  '    std::vector<GpuMaterial> gpu_materials;\n',
                  '    std::vector<GpuMaterial> gpu_materials;\n    std::vector<Scene::RenderItem> render_items;\n',
                  f'{path}: render item storage',
              )

              text = replace_region(
                  text,
                  '    std::uint64_t sceneSignature(const Ecs::World& world) const\n',
                  '    CameraState cameraState(const Ecs::World& world) const\n',
                  scene_signature,
                  f'{path}: scene signature',
              )

              text = replace_region(
                  text,
                  '    CameraState cameraState(const Ecs::World& world) const\n',
                  '    std::uint64_t cameraSignature(const CameraState& camera) const\n',
                  camera_convert,
                  f'{path}: camera state',
              )

              text = replace_region(
                  text,
                  '    LightState lightState(const Ecs::World& world) const\n',
                  '    std::uint64_t lightSignature(const LightState& light) const\n',
                  light_convert,
                  f'{path}: light state',
              )

              text = replace_once(
                  text,
                  '    bool syncScene(const Ecs::World& world)\n',
                  '    bool syncScene(\n        const Ecs::World& world,\n        const std::vector<Scene::RenderItem>& items\n    )\n',
                  f'{path}: syncScene signature',
              )

              anchor = text.find('        gpu_triangles.reserve(262144u);\n')
              if anchor < 0:
                  raise SystemExit(f'{path}: triangle reserve anchor missing')
              loop_start = text.find('        for (const Ecs::Entity entity : world.entities()) {\n', anchor)
              if loop_start < 0:
                  raise SystemExit(f'{path}: syncScene entity loop missing')
              material_line = '            const Models::MaterialData *material = Models::material(mesh_component->material);\n'
              material_pos = text.find(material_line, loop_start)
              if material_pos < 0:
                  raise SystemExit(f'{path}: syncScene material lookup missing')
              text = text[:loop_start] + item_loop + text[material_pos + len(material_line):]

              text = replace_once(
                  text,
                  '    const Impl::CameraState camera = impl_->cameraState(world);\n',
                  '    const Scene::CameraState scene_camera = Scene::cameraState(world);\n'
                  '    const Impl::CameraState camera = impl_->cameraState(scene_camera);\n',
                  f'{path}: render camera',
              )
              text = replace_once(
                  text,
                  '    const Impl::LightState light = impl_->lightState(world);\n',
                  '    const Scene::LightState scene_light = Scene::lightState(world);\n'
                  '    const Impl::LightState light = impl_->lightState(scene_light);\n',
                  f'{path}: render light',
              )
              text = replace_once(
                  text,
                  '        const std::uint64_t next_scene_signature = impl_->sceneSignature(world);\n',
                  '        Scene::collectRenderItems(world, impl_->render_items);\n'
                  '        const std::uint64_t next_scene_signature =\n'
                  '            impl_->sceneSignature(world, impl_->render_items);\n',
                  f'{path}: render items collection',
              )
              text = replace_once(
                  text,
                  '            if (!impl_->syncScene(world)) {\n',
                  '            if (!impl_->syncScene(world, impl_->render_items)) {\n',
                  f'{path}: syncScene call',
              )
              text = replace_once(
                  text,
                  '    impl_->gpu_materials.clear();\n',
                  '    impl_->gpu_materials.clear();\n    impl_->render_items.clear();\n',
                  f'{path}: render item cleanup',
              )

              for forbidden in (
                  'using Mat4 = std::array<float, 16>;',
                  'Mat4 modelMatrix(const Transform& transform)',
                  'Mat4 inverseModelMatrix(const Transform& transform)',
                  'CameraState cameraState(const Ecs::World& world)',
                  'LightState lightState(const Ecs::World& world)',
              ):
                  if forbidden in text:
                      raise SystemExit(f'{path}: old duplicate remains: {forbidden}')

              for required in (
                  '#include "Renderer/Math.hpp"',
                  '#include "Renderer/Scene.hpp"',
                  'Scene::collectRenderItems',
                  'Scene::cameraState',
                  'Scene::lightState',
                  'std::vector<Scene::RenderItem> render_items',
              ):
                  if required not in text:
                      raise SystemExit(f'{path}: required common use missing: {required}')

              path.write_text(text)
          PY
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev
          git clone --depth 1 --branch v2.9.3 https://github.com/xt9y/lwcgl.git "$RUNNER_TEMP/lwcgl"
          make -C "$RUNNER_TEMP/lwcgl" clean all
          sudo make -C "$RUNNER_TEMP/lwcgl" install
          git clone --depth 1 https://github.com/xt9y/C-BuildSystem.git "$RUNNER_TEMP/cbuild"
          make -C "$RUNNER_TEMP/cbuild" clean all
          sudo make -C "$RUNNER_TEMP/cbuild" install
      - name: Verify Linux PathTracer build
        run: |
          c clean || true
          c build
      - name: Commit refactor
        run: |
          set -euo pipefail
          git config user.name xt9y
          git config user.email felix@xt9y.de
          git add Sources/Renderer/PathTracer/PathTracer.cpp Sources/Renderer/PathTracer/PathTracerMetal.cpp
          git diff --cached --check
          git commit -m 'renderer: reuse common scene data in path tracer'
          git pull --rebase origin main
          git push origin HEAD:main
