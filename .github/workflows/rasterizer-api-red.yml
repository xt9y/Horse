name: Rasterizer API Contract

on:
  push:
    branches: [main]
    paths:
      - 'tests/rasterizer_architecture_contract.cpp'
      - 'Sources/Renderer/Rasterizer/Rasterizer.hpp'
      - 'Sources/Renderer/Render.hpp'
      - '.github/workflows/rasterizer-api-red.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Rasterizer API contract
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. -ISources \
            -c tests/rasterizer_architecture_contract.cpp \
            -o /tmp/rasterizer-architecture-contract.o
