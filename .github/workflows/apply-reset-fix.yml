name: Apply reset coverage fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-reset-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reset coverage fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('Sources/Renderer/PathTracer/PathTracerWorldFastShaders.hpp'): [
                  ('const int MOVING_PHASE_GRID = 4;', 'const int RESET_PHASE_GRID = 1;'),
                  ('uResetAccumulation != 0 ? MOVING_PHASE_GRID : STATIONARY_PHASE_GRID',
                   'uResetAccumulation != 0 ? RESET_PHASE_GRID : STATIONARY_PHASE_GRID'),
              ],
              Path('Sources/Renderer/PathTracer/PathTracerMetalShaders.hpp'): [
                  ('constant uint MOVING_PHASE_GRID = 4u;', 'constant uint RESET_PHASE_GRID = 1u;'),
                  ('reset ? MOVING_PHASE_GRID : STATIONARY_PHASE_GRID',
                   'reset ? RESET_PHASE_GRID : STATIONARY_PHASE_GRID'),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text()
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          git config user.name xt9y
          git config user.email felix@xt9y.de
          git add Sources/Renderer/PathTracer/PathTracerWorldFastShaders.hpp Sources/Renderer/PathTracer/PathTracerMetalShaders.hpp
          git diff --cached --check
          git commit -m "fix: render full frame after path tracer reset"
          git push origin HEAD:main
