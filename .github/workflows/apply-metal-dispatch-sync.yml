name: Apply Metal Dispatch Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-metal-dispatch-sync.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch dispatchAndPresent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Sources/Renderer/PathTracer/PathTracerMetal.cpp')
          source = path.read_text()
          old = '''        if (ok) ok = Metal.draw(command, 0u, 3u) == 0;
                  if (ok) ok = Metal.present(command) == 0;
                  if (ok) ok = Metal.commit(command) == 0;
                  Metal.destroyCommand(command);'''
          new = '''        if (ok) ok = Metal.draw(command, 0u, 3u) == 0;
                  if (ok) ok = Metal.present(command) == 0;
                  if (ok) ok = Metal.commit(command) == 0;
                  if (ok) ok = Metal.wait(command) == 0;
                  Metal.destroyCommand(command);'''
          if old not in source:
              raise SystemExit('expected dispatchAndPresent sequence not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name xt9y
          git config user.email felix@xt9y.de
          git add Sources/Renderer/PathTracer/PathTracerMetal.cpp
          git commit -m 'fix: wait for Metal path tracer frame completion'
          git push origin HEAD:main
